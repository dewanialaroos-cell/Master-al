name: Run Crypto Master AI Scanner

on:
  schedule:
    on:
  schedule:
    - cron: '*/5 * * * *'  # Ab yeh har 5 minute baad khud ba khud run hoga
  workflow_dispatch:
  # Manual run button ke liye

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install ccxt pandas numpy scikit-learn requests feedparser
        

      - name: Run God-Mode Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: |
          python main.py
