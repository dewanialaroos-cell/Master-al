Name: run Crypto Master AI Scanner

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Quant Scanner Daemon and Auto-Commit
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: |
          # Ensure JSON memory files exist before running python/git
          touch ai_quantum_mind.json alerted_history.json
          
          python main.py
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status
          
          # Force add use karein taake files lazmi commit ho jayein
          git add -f ai_quantum_mind.json
          git add -f alerted_history.json
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 AI Self-Learning Memory Update [skip ci]"
          
          git push || true
          
