name: Run Crypto Master AI Scanner

on:
  workflow_dispatch: # Iss option se aap manually button daba kar run kar sakte hain
  schedule:
    - cron: '0 */2 * * *' # Har 2 ghante mein automatically run hoga (Optional)

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/python-version@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy requests feedparser python-dotenv

      - name: Run Master AI Scanner
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: |
          python main.py

      - name: Upload Scan Results CSV
        uses: actions/upload-artifact@v4
        with:
          name: crypto-scan-results
          path: crypto_scan_results.csv
          
